{% extends 'shopapp/base.html' %}

{% block title %}
Confirm archiving {{ object.name }}
{% endblock %}

{% block body %}
<h1>Are you sure you want to archive {{ object.name }} ?</h1>
<div>
    <a href="{% url 'shopapp:details_product' pk=product.pk %}">
        Back to product
    </a>
</div>
<br>
<div>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Archive</button>
    </form>
</div>
{% endblock %}
