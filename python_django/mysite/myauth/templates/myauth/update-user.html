{% extends 'myauth/base.html' %}

{% block title %}
    Update user pofile
{% endblock %}

{% block body %}
    <h1> Update user </h1>
    <div>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">
                Submit
            </button>
        </form>
    </div>
    <br>
     <a href="{% url 'myauth:users-list' %}">
         Back to list</a>
{% endblock %}
